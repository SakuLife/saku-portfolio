<!DOCTYPE html>

<head>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root { --g: #217346; --mint: #5ee6a0; --gold: #f5c864; --ink: #06140d; --card: #0f2a1d; --text: #e8f3ec; --sub: #a9c2b4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;

    main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid rgba(94,230,160,.35); border-radius: 18px; padding: 32px 24px; text-align: center; }

    h1 { font-size: 1.4rem; margin: .4rem 0 .6rem; }
    p { color: var(--sub); margin: 0 0 1.4rem; font-size: .95rem; }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    a.btn { display: block; padding: 14px 16px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    .primary { background: linear-gradient(90deg, var(--mint), var(--gold)); color: var(--ink); }
    .ghost { border: 1px solid rgba(94,230,160,.45); color: var(--text); }
  </style>
